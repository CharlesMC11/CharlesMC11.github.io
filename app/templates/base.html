<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="author" content="Charles Mesa Cayobit"/>
  <title>Charles Mesa Cayobit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link
    href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@700&display=swap"
    rel="stylesheet"/>
  <script src="https://kit.fontawesome.com/ebd1029440.js"
          crossorigin="anonymous">
  </script>
  <link rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"/>
  {% block head %}{% endblock head %}
</head>

<body>
<header>
  <section class="brand" id="brand">
    <a class="brand__link" href="{{ url_for('index') }}">
      <h1 class="brand__name courier-prime-bold">Charles Mesa Cayobit</h1>
      <h2 class="brand__title">Programmer | Technical Artist |
        Photographer</h2>
    </a>
  </section>
  <nav class="navbar__container">
    <ul class="navbar">
      <li class="navbar__item">
        <a class="navbar__link" href="{{ url_for('cv.view') }}">Curriculum
          Vitae</a>
      </li>
      <li class="navbar__item">
        <a class="navbar__link" href="{{ url_for('about_me') }}">About Me</a>
      </li>
    </ul>
  </nav>
  <hr/>
</header>

<main>{% block content %}{% endblock content %}</main>

<footer>
  <hr/>
  <section class="navbar__container">
    <ul class="navbar">
      <li class="navbar__item">
        <a class="navbar__link" href="mailto:charlesmesacayobit@gmail.com"
           title="Send an email to Charles Mesa Cayobit">
          <i class="fa-solid fa-envelope"></i>
        </a>
      </li>

      <li class="navbar__item">
        <a class="navbar__link"
           href="https://www.linkedin.com/in/charlesmesacayobit"
           title="Open LinkedIn in a new tab" target="_blank">
          <i class="fa-brands fa-linkedin"></i>
        </a>
      </li>

      <li class="navbar__item">
        <a class="navbar__link" href="https://github.com/CharlesMC11"
           title="Open GitHub in a new tab" target="_blank">
          <i class="fa-brands fa-github-alt"></i>
        </a>
      </li>

      <li class="navbar__item">
        <a class="navbar__link" href="https://instagram.com/charlesmc.techart"
           title="Open Instagram in a new tab" target="_blank">
          <i class="fa-brands fa-instagram"></i>
        </a>
      </li>
    </ul>
  </section>

  <section class="footer__copyright">
    <p>© Charles Mesa Cayobit</p>
    <p>Made with Flask. Hosted on GitHub Pages.</p>
  </section>
</footer>
</body>
</html>
